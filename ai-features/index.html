<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 工具箱 - 蒲草书屋</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --color-accent: #5b7e6e;
      --color-accent-light: #e8f0ec;
      --color-border: #e8e8e8;
      --color-gray: #666;
      --color-black: #000;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    
    body {
      font-family: var(--font-family);
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
      background: #fafafa;
      min-height: 100vh;
    }
    
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      color: var(--color-black);
    }
    
    .subtitle {
      color: var(--color-gray);
      margin-bottom: 32px;
      font-size: 14px;
    }
    
    .card {
      background: white;
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }
    
    .card h2 {
      font-size: 18px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    label {
      display: block;
      font-size: 13px;
      color: var(--color-gray);
      margin-bottom: 6px;
    }
    
    textarea, input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      font-family: var(--font-family);
      font-size: 14px;
      transition: border-color 0.2s;
    }
    
    textarea:focus, input:focus {
      outline: none;
      border-color: var(--color-accent);
    }
    
    textarea {
      min-height: 100px;
      resize: vertical;
      margin-bottom: 12px;
    }
    
    select {
      padding: 8px 12px;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      font-size: 13px;
      margin-left: 8px;
    }
    
    .btn-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    
    button {
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      font-family: var(--font-family);
    }
    
    .btn-primary {
      background: var(--color-accent);
      color: white;
    }
    
    .btn-primary:hover {
      background: #4a6b5d;
    }
    
    .btn-secondary {
      background: var(--color-accent-light);
      color: var(--color-accent);
    }
    
    .btn-secondary:hover {
      background: #d8e6de;
    }
    
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    .result {
      margin-top: 16px;
      padding: 16px;
      background: #f8f9fa;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.6;
    }
    
    .result.error {
      background: #fff5f5;
      color: #c53030;
    }
    
    .result.success {
      background: var(--color-accent-light);
    }
    
    /* 音频播放器 */
    .audio-player {
      margin-top: 12px;
    }
    
    audio {
      width: 100%;
      border-radius: 8px;
    }
    
    /* 图片预览 */
    .image-preview {
      margin-top: 16px;
      text-align: center;
    }
    
    .image-preview img {
      max-width: 100%;
      max-height: 400px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    
    .loading {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid var(--color-border);
      border-top-color: var(--color-accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .tips {
      font-size: 12px;
      color: var(--color-gray);
      margin-top: 8px;
    }
    
    /* 配置区域 */
    .config-section {
      background: #fffbeb;
      border: 1px solid #fbbf24;
    }
    
    .config-section h2::before {
      content: '⚙️';
    }
    
    .api-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      margin-left: auto;
    }
    
    .api-status.ok {
      background: #d1fae5;
      color: #065f46;
    }
    
    .api-status.error {
      background: #fee2e2;
      color: #991b1b;
    }
  </style>
</head>
<body>
  <h1>🎨 蒲草书屋 AI 工具箱</h1>
  <p class="subtitle">语音朗读 · AI 配图生成</p>
  
  <!-- 配置 -->
  <div class="card config-section">
    <h2>API 配置 <span id="api-status" class="api-status">检查中...</span></h2>
    <label>Cloudflare Worker 地址</label>
    <input type="text" id="api-url" placeholder="https://pugrass-ai.你的账号.workers.dev" value="">
    <p class="tips">💡 部署 Cloudflare Worker 后，将地址填入上方输入框</p>
  </div>
  
  <!-- 语音朗读 -->
  <div class="card">
    <h2>🔊 语音朗读</h2>
    <label>输入要朗读的文字</label>
    <textarea id="tts-text" placeholder="输入你想让 AI 朗读的文字内容...">欢迎来到蒲草书屋，这里收录了科技、建筑、文学、摄影、艺术等领域的深度文章。</textarea>
    
    <div class="btn-row">
      <label style="margin: 0;">音色:</label>
      <select id="voice-select">
        <option value="Chinese (Mandarin)_Lyrical_Voice">中文-抒情语音</option>
        <option value="Chinese (Mandarin)_HK_Flight_Attendant">中文-香港空乘</option>
        <option value="Cantonese_GentleLady">粤语-温柔女士</option>
        <option value="English_Graceful_Lady">英文-优雅女士</option>
        <option value="English_Insightful_Speaker">英文-睿智演讲者</option>
      </select>
    </div>
    
    <div class="btn-row" style="margin-top: 16px;">
      <button id="tts-btn" class="btn-primary" onclick="generateSpeech()">
        🔊 生成朗读
      </button>
      <button class="btn-secondary" onclick="playDemo()">▶️ 听示例</button>
    </div>
    
    <div id="tts-result"></div>
  </div>
  
  <!-- AI 配图 -->
  <div class="card">
    <h2>🖼️ AI 配图生成</h2>
    <label>图片描述（英文效果更好）</label>
    <textarea id="img-prompt" placeholder="描述你想要的图片，如：A minimalist bookshop with warm lighting, wooden shelves filled with books, a cozy reading corner with a comfortable armchair...">A serene Chinese traditional study with bamboo scrolls, ink stones, and soft natural light streaming through paper windows, peaceful atmosphere</textarea>
    
    <div class="btn-row">
      <label style="margin: 0;">风格:</label>
      <select id="style-select">
        <option value="natural">自然真实</option>
        <option value="anime">动漫风格</option>
        <option value="flat_illustration">扁平插画</option>
      </select>
    </div>
    
    <div class="btn-row" style="margin-top: 16px;">
      <button id="img-btn" class="btn-primary" onclick="generateImage()">
        🎨 生成图片
      </button>
      <button class="btn-secondary" onclick="showPromptIdeas()">💡 灵感提示</button>
    </div>
    
    <div id="img-result"></div>
  </div>
  
  <footer style="text-align: center; margin-top: 40px; color: #888; font-size: 13px;">
    <p>Powered by MiniMax API · 蒲草书屋</p>
  </footer>

  <script>
    // ===== 配置 =====
    let API_BASE = localStorage.getItem('pugrass_ai_url') || '';
    
    // 页面加载时恢复配置
    document.getElementById('api-url').value = API_BASE;
    
    // 保存 API 地址
    document.getElementById('api-url').addEventListener('change', (e) => {
      API_BASE = e.target.value.trim();
      localStorage.setItem('pugrass_ai_url', API_BASE);
      checkApiStatus();
    });
    
    // ===== API 状态检查 =====
    async function checkApiStatus() {
      const statusEl = document.getElementById('api-status');
      if (!API_BASE) {
        statusEl.className = 'api-status error';
        statusEl.textContent = '未配置';
        return false;
      }
      
      try {
        const res = await fetch(`${API_BASE}/health`);
        if (res.ok) {
          statusEl.className = 'api-status ok';
          statusEl.textContent = '✓ 已连接';
          return true;
        }
      } catch (e) {}
      
      statusEl.className = 'api-status error';
      statusEl.textContent = '✗ 连接失败';
      return false;
    }
    
    // 页面加载时检查
    if (API_BASE) checkApiStatus();
    
    // ===== 语音合成 =====
    async function generateSpeech() {
      const btn = document.getElementById('tts-btn');
      const resultEl = document.getElementById('tts-result');
      const text = document.getElementById('tts-text').value.trim();
      const voice = document.getElementById('voice-select').value;
      
      if (!text) {
        alert('请输入要朗读的文字');
        return;
      }
      
      if (!API_BASE) {
        alert('请先配置 Cloudflare Worker 地址');
        return;
      }
      
      btn.disabled = true;
      btn.innerHTML = '<span class="loading"><span class="spinner"></span>生成中...</span>';
      resultEl.innerHTML = '';
      
      try {
        const res = await fetch(`${API_BASE}/tts`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, voice_id: voice, speed: 1.0 })
        });
        
        if (!res.ok) {
          throw new Error('生成失败: ' + await res.text());
        }
        
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        
        resultEl.innerHTML = `
          <div class="result success">✅ 朗读已生成！</div>
          <div class="audio-player">
            <audio controls src="${url}"></audio>
            <br>
            <button class="btn-secondary" onclick="downloadAudio('${url}')" style="margin-top:8px">💾 下载音频</button>
          </div>
        `;
      } catch (error) {
        resultEl.innerHTML = `<div class="result error">❌ ${error.message}</div>`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = '🔊 生成朗读';
      }
    }
    
    async function playDemo() {
      const demoText = '欢迎来到蒲草书屋，这里收录了科技、建筑、文学、摄影、艺术等领域的深度文章。愿你在这里找到精神的栖息地。';
      const btn = document.getElementById('tts-btn');
      const resultEl = document.getElementById('tts-result');
      
      if (!API_BASE) {
        alert('请先配置 Cloudflare Worker 地址');
        return;
      }
      
      btn.disabled = true;
      btn.innerHTML = '<span class="loading"><span class="spinner"></span>生成中...</span>';
      
      try {
        const res = await fetch(`${API_BASE}/tts`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: demoText, voice_id: 'female-qn-qingxin', speed: 1.0 })
        });
        
        if (!res.ok) throw new Error('生成失败');
        
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        
        resultEl.innerHTML = `
          <div class="result success">✅ 示例朗读已生成！</div>
          <div class="audio-player">
            <audio controls src="${url}"></audio>
          </div>
        `;
        
        // 自动播放
        const audio = resultEl.querySelector('audio');
        audio.play().catch(() => {});
      } catch (error) {
        resultEl.innerHTML = `<div class="result error">❌ ${error.message}</div>`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = '🔊 生成朗读';
      }
    }
    
    function downloadAudio(url) {
      const a = document.createElement('a');
      a.href = url;
      a.download = `蒲草书屋朗读_${Date.now()}.mp3`;
      a.click();
    }
    
    // ===== 图片生成 =====
    async function generateImage() {
      const btn = document.getElementById('img-btn');
      const resultEl = document.getElementById('img-result');
      const prompt = document.getElementById('img-prompt').value.trim();
      const style = document.getElementById('style-select').value;
      
      if (!prompt) {
        alert('请输入图片描述');
        return;
      }
      
      if (!API_BASE) {
        alert('请先配置 Cloudflare Worker 地址');
        return;
      }
      
      btn.disabled = true;
      btn.innerHTML = '<span class="loading"><span class="spinner"></span>生成中...</span>';
      resultEl.innerHTML = '';
      
      try {
        const res = await fetch(`${API_BASE}/image`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt, style })
        });
        
        if (!res.ok) throw new Error('生成失败: ' + await res.text());
        
        const data = await res.json();
        const imageUrl = data.data?.[0]?.b64_json || data.data?.[0]?.url;
        
        if (imageUrl) {
          resultEl.innerHTML = `
            <div class="result success">✅ 图片已生成！</div>
            <div class="image-preview">
              <img src="data:image/png;base64,${imageUrl}" alt="AI 生成的图片" />
            </div>
            <button class="btn-secondary" onclick="downloadImage('${imageUrl}')" style="margin-top:12px">💾 下载图片</button>
          `;
        } else {
          throw new Error('未获取到图片数据');
        }
      } catch (error) {
        resultEl.innerHTML = `<div class="result error">❌ ${error.message}</div>`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = '🎨 生成图片';
      }
    }
    
    function downloadImage(b64) {
      // Base64 下载
      const link = document.createElement('a');
      link.href = `data:image/png;base64,${b64}`;
      link.download = `蒲草书屋配图_${Date.now()}.png`;
      link.click();
    }
    
    function downloadImageFromData(data) {
      if (data && data.length > 0) {
        downloadImage(data[0]);
      }
    }
    
    function showPromptIdeas() {
      const ideas = [
        'A cozy minimalist library with floor-to-ceiling bookshelves, warm wood tones, natural light from large windows, a comfortable leather armchair, and scattered plants',
        'Traditional Chinese ink painting style, a scholar\'s desk with bamboo brushes, ink stone, and ancient scrolls, peaceful mountain landscape through the window',
        'Modern architecture meets nature, a glass-walled study overlooking a serene garden with cherry blossoms, clean lines and organic shapes',
        'Abstract digital art, the concept of reading and imagination, floating books transforming into stars and constellations',
        'Cozy autumn reading corner, warm golden light, knitted blankets, a cup of tea, falling leaves outside the window'
      ];
      
      const randomIdea = ideas[Math.floor(Math.random() * ideas.length)];
      document.getElementById('img-prompt').value = randomIdea;
    }
  </script>
</body>
</html>
