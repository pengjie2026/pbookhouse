<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 工具箱 - 蒲草书屋</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --color-accent: #5b7e6e;
      --color-accent-light: #e8f0ec;
      --color-border: #e8e8e8;
      --color-gray: #666;
      --color-black: #000;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    
    body {
      font-family: var(--font-family);
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
      background: #fafafa;
      min-height: 100vh;
    }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      color: var(--color-black);
    }
    
    .version-badge {
      background: var(--color-accent-light);
      color: var(--color-accent);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }
    
    .subtitle {
      color: var(--color-gray);
      margin-bottom: 32px;
      font-size: 14px;
    }
    
    .card {
      background: white;
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }
    
    .card h2 {
      font-size: 18px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    label {
      display: block;
      font-size: 13px;
      color: var(--color-gray);
      margin-bottom: 6px;
    }
    
    textarea, input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      font-family: var(--font-family);
      font-size: 14px;
      transition: border-color 0.2s;
    }
    
    textarea:focus, input:focus {
      outline: none;
      border-color: var(--color-accent);
    }
    
    textarea {
      min-height: 100px;
      resize: vertical;
      margin-bottom: 12px;
    }
    
    textarea.mini {
      min-height: 60px;
    }
    
    select {
      padding: 8px 12px;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      font-size: 13px;
      margin-left: 8px;
    }
    
    .btn-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    
    button {
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      font-family: var(--font-family);
    }
    
    .btn-primary {
      background: var(--color-accent);
      color: white;
    }
    
    .btn-primary:hover {
      background: #4a6b5d;
    }
    
    .btn-secondary {
      background: var(--color-accent-light);
      color: var(--color-accent);
    }
    
    .btn-secondary:hover {
      background: #d8e6de;
    }
    
    .btn-debug {
      background: #fef3c7;
      color: #92400e;
    }
    
    .btn-debug:hover {
      background: #fde68a;
    }
    
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    .result {
      margin-top: 16px;
      padding: 16px;
      background: #f8f9fa;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    
    .result.error {
      background: #fff5f5;
      color: #c53030;
    }
    
    .result.success {
      background: var(--color-accent-light);
    }
    
    .result.debug {
      background: #fffbeb;
      border: 1px solid #fbbf24;
      max-height: 300px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 12px;
    }
    
    /* 音频播放器 */
    .audio-player {
      margin-top: 12px;
    }
    
    audio {
      width: 100%;
      border-radius: 8px;
    }
    
    /* 图片预览 */
    .image-preview {
      margin-top: 16px;
      text-align: center;
    }
    
    .image-preview img {
      max-width: 100%;
      max-height: 400px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    
    /* 文本生成结果 */
    .text-result {
      margin-top: 16px;
      padding: 16px;
      background: #f8f9fa;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.8;
      white-space: pre-wrap;
    }
    
    .loading {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid var(--color-border);
      border-top-color: var(--color-accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .tips {
      font-size: 12px;
      color: var(--color-gray);
      margin-top: 8px;
    }
    
    /* 配置区域 */
    .config-section {
      background: #fffbeb;
      border: 1px solid #fbbf24;
    }
    
    .config-section h2::before {
      content: '⚙️';
    }
    
    .api-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      margin-left: auto;
    }
    
    .api-status.ok {
      background: #d1fae5;
      color: #065f46;
    }
    
    .api-status.error {
      background: #fee2e2;
      color: #991b1b;
    }
    
    .api-status.checking {
      background: #fef3c7;
      color: #92400e;
    }
    
    /* 版本信息 */
    .version-info {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--color-gray);
    }
    
    .version-info button {
      padding: 4px 10px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🎨 蒲草书屋 AI 工具箱</h1>
    <span id="version-badge" class="version-badge">v1.0.2</span>
  </div>
  <p class="subtitle">语音朗读 · AI 配图生成 · AI 写作优化</p>
  
  <!-- 配置 -->
  <div class="card config-section">
    <h2>API 配置 <span id="api-status" class="api-status checking">检查中...</span></h2>
    <label>Cloudflare Worker 地址</label>
    <input type="text" id="api-url" placeholder="https://pugrass-ai.你的账号.workers.dev" value="">
    <div class="btn-row" style="margin-top: 8px;">
      <p class="tips">💡 部署 Cloudflare Worker 后，将地址填入上方输入框</p>
    </div>
    <div class="version-info" style="margin-top: 12px;">
      <span>当前版本: <strong id="server-version">-</strong></span>
      <button class="btn-debug" onclick="checkVersion()">🔄 检查更新</button>
      <button class="btn-debug" onclick="runDebug()">🔧 调试</button>
    </div>
  </div>
  
  <!-- 语音朗读 -->
  <div class="card">
    <h2>🔊 语音朗读</h2>
    <label>输入要朗读的文字</label>
    <textarea id="tts-text" placeholder="输入你想让 AI 朗读的文字内容...">欢迎来到蒲草书屋，这里收录了科技、建筑、文学、摄影、艺术等领域的深度文章。</textarea>
    
    <div class="btn-row">
      <label style="margin: 0;">音色:</label>
      <select id="voice-select">
        <option value="Chinese (Mandarin)_Lyrical_Voice">中文-抒情语音</option>
        <option value="Chinese (Mandarin)_HK_Flight_Attendant">中文-香港空乘</option>
        <option value="Cantonese_GentleLady">粤语-温柔女士</option>
        <option value="English_Graceful_Lady">英文-优雅女士</option>
        <option value="English_Insightful_Speaker">英文-睿智演讲者</option>
      </select>
    </div>
    
    <div class="btn-row" style="margin-top: 16px;">
      <button id="tts-btn" class="btn-primary" onclick="generateSpeech()">
        🔊 生成朗读
      </button>
      <button class="btn-secondary" onclick="playDemo()">▶️ 听示例</button>
      <button class="btn-debug" onclick="debugTTS()">🔧 TTS调试</button>
    </div>
    
    <div id="tts-result"></div>
  </div>
  
  <!-- AI 配图 -->
  <div class="card">
    <h2>🖼️ AI 配图生成</h2>
    <label>图片描述（英文效果更好）</label>
    <textarea id="img-prompt" placeholder="描述你想要的图片，如：A minimalist bookshop with warm lighting, wooden shelves filled with books...">A serene Chinese traditional study with bamboo scrolls, ink stones, and soft natural light streaming through paper windows, peaceful atmosphere</textarea>
    
    <div class="btn-row">
      <label style="margin: 0;">风格:</label>
      <select id="style-select">
        <option value="natural">自然真实</option>
        <option value="anime">动漫风格</option>
        <option value="flat_illustration">扁平插画</option>
      </select>
    </div>
    
    <div class="btn-row" style="margin-top: 16px;">
      <button id="img-btn" class="btn-primary" onclick="generateImage()">
        🎨 生成图片
      </button>
      <button class="btn-secondary" onclick="showPromptIdeas()">💡 灵感提示</button>
      <button class="btn-debug" onclick="debugImage()">🔧 图片调试</button>
    </div>
    
    <div id="img-result"></div>
  </div>
  
  <!-- AI 写作优化 -->
  <div class="card">
    <h2>✍️ AI 写作优化</h2>
    <label>输入需要优化的文字或提问</label>
    <textarea id="text-prompt" class="mini" placeholder="输入你想要 AI 优化或回答的内容，如：帮我写一段关于读书的开场白...">请介绍一下你自己，包括你的能力、特长和应用场景。</textarea>
    
    <div class="btn-row">
      <label style="margin: 0;">模型:</label>
      <select id="text-model-select">
        <option value="abab6.5s-chat">abab6.5s (快速)</option>
        <option value="abab6.5-chat">abab6.5 (平衡)</option>
        <option value="abab5.5s-chat">abab5.5s (轻量)</option>
      </select>
    </div>
    
    <div class="btn-row" style="margin-top: 16px;">
      <button id="text-btn" class="btn-primary" onclick="generateText()">
        ✍️ 生成优化
      </button>
      <button class="btn-secondary" onclick="useTextTemplate()">📝 使用模板</button>
    </div>
    
    <div id="text-result"></div>
  </div>
  
  <footer style="text-align: center; margin-top: 40px; color: #888; font-size: 13px;">
    <p>Powered by MiniMax API · 蒲草书屋 · v1.0.2</p>
  </footer>

  <script>
    // ===== 配置 =====
    const FRONTEND_VERSION = '1.0.2';
    let API_BASE = localStorage.getItem('pugrass_ai_url') || '';
    
    // 更新版本显示
    document.getElementById('version-badge').textContent = `v${FRONTEND_VERSION}`;
    
    // 页面加载时恢复配置
    document.getElementById('api-url').value = API_BASE;
    
    // 保存 API 地址
    document.getElementById('api-url').addEventListener('change', (e) => {
      API_BASE = e.target.value.trim();
      localStorage.setItem('pugrass_ai_url', API_BASE);
      checkApiStatus();
      checkVersion();
    });
    
    // ===== API 状态检查 =====
    async function checkApiStatus() {
      const statusEl = document.getElementById('api-status');
      if (!API_BASE) {
        statusEl.className = 'api-status error';
        statusEl.textContent = '未配置';
        return false;
      }
      
      try {
        const res = await fetch(`${API_BASE}/health`);
        if (res.ok) {
          statusEl.className = 'api-status ok';
          statusEl.textContent = '✓ 已连接';
          return true;
        }
      } catch (e) {
        console.error('API check failed:', e);
      }
      
      statusEl.className = 'api-status error';
      statusEl.textContent = '✗ 连接失败';
      return false;
    }
    
    // ===== 版本检查 =====
    async function checkVersion() {
      const versionEl = document.getElementById('server-version');
      if (!API_BASE) {
        versionEl.textContent = '未连接';
        return;
      }
      
      try {
        const res = await fetch(`${API_BASE}/version`);
        if (res.ok) {
          const data = await res.json();
          const serverVer = data.version || 'unknown';
          versionEl.textContent = `v${serverVer}`;
          
          if (serverVer === FRONTEND_VERSION) {
            versionEl.style.color = '#065f46';
          } else {
            versionEl.style.color = '#92400e';
          }
        } else {
          versionEl.textContent = '获取失败';
        }
      } catch (e) {
        versionEl.textContent = '连接错误';
      }
    }
    
    // 页面加载时检查
    if (API_BASE) {
      checkApiStatus();
      checkVersion();
    }
    
    // ===== 调试功能 =====
    async function runDebug() {
      if (!API_BASE) {
        alert('请先配置 Cloudflare Worker 地址');
        return;
      }
      
      if (!confirm('即将运行调试接口，会显示 API 的原始返回数据。是否继续？')) {
        return;
      }
      
      const debugResult = document.createElement('div');
      debugResult.className = 'result debug';
      debugResult.innerHTML = '<div class="loading"><span class="spinner"></span>正在调试...</div>';
      document.body.appendChild(debugResult);
      
      try {
        // TTS 调试
        const ttsRes = await fetch(`${API_BASE}/debug/tts`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: '你好测试' })
        });
        const ttsData = await ttsRes.json();
        
        // 图片调试
        const imgRes = await fetch(`${API_BASE}/debug/image`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: '一只猫' })
        });
        const imgData = await imgRes.json();
        
        debugResult.innerHTML = `<strong>🔧 调试信息</strong>\n\n=== TTS 响应 ===\n${JSON.stringify(ttsData, null, 2)}\n\n=== 图片响应 ===\n${JSON.stringify(imgData, null, 2)}`;
      } catch (e) {
        debugResult.innerHTML = `<div class="result error">调试失败: ${e.message}</div>`;
      }
    }
    
    async function debugTTS() {
      if (!API_BASE) {
        alert('请先配置 Cloudflare Worker 地址');
        return;
      }
      
      const resultEl = document.getElementById('tts-result');
      resultEl.innerHTML = '<div class="result debug"><div class="loading"><span class="spinner"></span>正在调试 TTS...</div></div>';
      
      try {
        const res = await fetch(`${API_BASE}/debug/tts`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: '你好，这是测试' })
        });
        
        const data = await res.json();
        resultEl.innerHTML = `<div class="result debug"><strong>🔧 TTS 调试信息</strong>\n\n状态码: ${data.status}\nContent-Type: ${data.contentType}\n响应长度: ${data.bodyLength} 字符\n\n--- 响应预览 (前500字符) ---\n${data.bodyPreview}</div>`;
      } catch (e) {
        resultEl.innerHTML = `<div class="result error">调试失败: ${e.message}</div>`;
      }
    }
    
    async function debugImage() {
      if (!API_BASE) {
        alert('请先配置 Cloudflare Worker 地址');
        return;
      }
      
      const resultEl = document.getElementById('img-result');
      resultEl.innerHTML = '<div class="result debug"><div class="loading"><span class="spinner"></span>正在调试图片...</div></div>';
      
      try {
        const res = await fetch(`${API_BASE}/debug/image`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: '一只猫' })
        });
        
        const data = await res.json();
        resultEl.innerHTML = `<div class="result debug"><strong>🔧 图片调试信息</strong>\n\n状态码: ${data.status}\nContent-Type: ${data.contentType}\n响应长度: ${data.bodyLength} 字符\n\n--- 响应预览 (前1000字符) ---\n${data.bodyPreview}</div>`;
      } catch (e) {
        resultEl.innerHTML = `<div class="result error">调试失败: ${e.message}</div>`;
      }
    }
    
    // ===== 语音合成 =====
    async function generateSpeech() {
      const btn = document.getElementById('tts-btn');
      const resultEl = document.getElementById('tts-result');
      const text = document.getElementById('tts-text').value.trim();
      const voice = document.getElementById('voice-select').value;
      
      if (!text) {
        alert('请输入要朗读的文字');
        return;
      }
      
      if (!API_BASE) {
        alert('请先配置 Cloudflare Worker 地址');
        return;
      }
      
      btn.disabled = true;
      btn.innerHTML = '<span class="loading"><span class="spinner"></span>生成中...</span>';
      resultEl.innerHTML = '';
      
      try {
        const res = await fetch(`${API_BASE}/tts`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, voice_id: voice, speed: 1.0 })
        });
        
        if (!res.ok) {
          const errText = await res.text();
          throw new Error('生成失败: ' + errText);
        }
        
        const contentType = res.headers.get('content-type') || '';
        
        if (contentType.includes('application/json')) {
          // 返回的是 JSON 错误信息
          const data = await res.json();
          throw new Error(JSON.stringify(data, null, 2));
        }
        
        const blob = await res.blob();
        
        if (blob.size < 100) {
          throw new Error('音频文件太小，可能是生成失败');
        }
        
        const url = URL.createObjectURL(blob);
        
        resultEl.innerHTML = `
          <div class="result success">✅ 朗读已生成！文件大小: ${formatBytes(blob.size)}</div>
          <div class="audio-player">
            <audio controls src="${url}"></audio>
            <br>
            <button class="btn-secondary" onclick="downloadAudio('${url}')" style="margin-top:8px">💾 下载音频</button>
          </div>
        `;
      } catch (error) {
        resultEl.innerHTML = `<div class="result error">❌ ${error.message}</div>`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = '🔊 生成朗读';
      }
    }
    
    async function playDemo() {
      const demoText = '欢迎来到蒲草书屋，这里收录了科技、建筑、文学、摄影、艺术等领域的深度文章。愿你在这里找到精神的栖息地。';
      const btn = document.getElementById('tts-btn');
      const resultEl = document.getElementById('tts-result');
      
      if (!API_BASE) {
        alert('请先配置 Cloudflare Worker 地址');
        return;
      }
      
      btn.disabled = true;
      btn.innerHTML = '<span class="loading"><span class="spinner"></span>生成中...</span>';
      
      try {
        const res = await fetch(`${API_BASE}/tts`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: demoText, voice_id: 'Chinese (Mandarin)_Lyrical_Voice', speed: 1.0 })
        });
        
        if (!res.ok) throw new Error('生成失败');
        
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        
        resultEl.innerHTML = `
          <div class="result success">✅ 示例朗读已生成！</div>
          <div class="audio-player">
            <audio controls src="${url}"></audio>
          </div>
        `;
        
        // 自动播放
        const audio = resultEl.querySelector('audio');
        audio.play().catch(() => {});
      } catch (error) {
        resultEl.innerHTML = `<div class="result error">❌ ${error.message}</div>`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = '🔊 生成朗读';
      }
    }
    
    function downloadAudio(url) {
      const a = document.createElement('a');
      a.href = url;
      a.download = `蒲草书屋朗读_${Date.now()}.mp3`;
      a.click();
    }
    
    // ===== 图片生成 =====
    async function generateImage() {
      const btn = document.getElementById('img-btn');
      const resultEl = document.getElementById('img-result');
      const prompt = document.getElementById('img-prompt').value.trim();
      const style = document.getElementById('style-select').value;
      
      if (!prompt) {
        alert('请输入图片描述');
        return;
      }
      
      if (!API_BASE) {
        alert('请先配置 Cloudflare Worker 地址');
        return;
      }
      
      btn.disabled = true;
      btn.innerHTML = '<span class="loading"><span class="spinner"></span>生成中...</span>';
      resultEl.innerHTML = '';
      
      try {
        const res = await fetch(`${API_BASE}/image`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt, style })
        });
        
        if (!res.ok) {
          const errText = await res.text();
          throw new Error('生成失败: ' + errText);
        }
        
        const data = await res.json();
        
        // 兼容不同的返回格式
        let imageData = data.data?.[0] || data[0];
        // 可能是 base64 字符串直接放在 data[0]
        if (typeof imageData === 'string') {
          imageData = imageData;
        } else {
          imageData = imageData?.b64_json || imageData?.url;
        }
        
        if (imageData) {
          // 判断是 base64 还是 URL
          const isBase64 = imageData.length > 100 && !imageData.startsWith('http');
          const imgSrc = isBase64 ? `data:image/png;base64,${imageData}` : imageData;
          
          resultEl.innerHTML = `
            <div class="result success">✅ 图片已生成！</div>
            <div class="image-preview">
              <img src="${imgSrc}" alt="AI 生成的图片" />
            </div>
            ${isBase64 ? `<button class="btn-secondary" onclick="downloadImage('${imageData}')" style="margin-top:12px">💾 下载图片</button>` : ''}
          `;
        } else {
          // 没有图片，显示调试信息
          resultEl.innerHTML = `<div class="result error">❌ 未获取到图片数据</div>
            <div class="result debug"><pre>${JSON.stringify(data, null, 2)}</pre></div>`;
        }
      } catch (error) {
        resultEl.innerHTML = `<div class="result error">❌ ${error.message}</div>`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = '🎨 生成图片';
      }
    }
    
    function downloadImage(b64) {
      const link = document.createElement('a');
      link.href = `data:image/png;base64,${b64}`;
      link.download = `蒲草书屋配图_${Date.now()}.png`;
      link.click();
    }
    
    function showPromptIdeas() {
      const ideas = [
        'A cozy minimalist library with floor-to-ceiling bookshelves, warm wood tones, natural light from large windows, a comfortable leather armchair',
        'Traditional Chinese ink painting style, a scholar\'s desk with bamboo brushes, ink stone, and ancient scrolls, peaceful mountain landscape',
        'Modern architecture meets nature, a glass-walled study overlooking a serene garden with cherry blossoms',
        'Abstract digital art, the concept of reading and imagination, floating books transforming into stars',
        'Cozy autumn reading corner, warm golden light, knitted blankets, a cup of tea, falling leaves'
      ];
      
      const randomIdea = ideas[Math.floor(Math.random() * ideas.length)];
      document.getElementById('img-prompt').value = randomIdea;
    }
    
    // ===== 文本生成 =====
    async function generateText() {
      const btn = document.getElementById('text-btn');
      const resultEl = document.getElementById('text-result');
      const prompt = document.getElementById('text-prompt').value.trim();
      const model = document.getElementById('text-model-select').value;
      
      if (!prompt) {
        alert('请输入需要优化的文字或提问');
        return;
      }
      
      if (!API_BASE) {
        alert('请先配置 Cloudflare Worker 地址');
        return;
      }
      
      btn.disabled = true;
      btn.innerHTML = '<span class="loading"><span class="spinner"></span>生成中...</span>';
      resultEl.innerHTML = '';
      
      try {
        const res = await fetch(`${API_BASE}/text`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt, model })
        });
        
        if (!res.ok) {
          const errText = await res.text();
          throw new Error('生成失败: ' + errText);
        }
        
        const data = await res.json();
        
        if (data.text) {
          resultEl.innerHTML = `
            <div class="result success">✅ 文本已生成！</div>
            <div class="text-result">${escapeHtml(data.text)}</div>
          `;
        } else if (data.debug) {
          // 返回调试信息
          resultEl.innerHTML = `<div class="result debug"><pre>${JSON.stringify(data, null, 2)}</pre></div>`;
        } else {
          resultEl.innerHTML = `<div class="result error">❌ 未获取到文本数据</div>
            <div class="result debug"><pre>${JSON.stringify(data, null, 2)}</pre></div>`;
        }
      } catch (error) {
        resultEl.innerHTML = `<div class="result error">❌ ${error.message}</div>`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = '✍️ 生成优化';
      }
    }
    
    function useTextTemplate() {
      const templates = [
        { name: '开场白', prompt: '请帮我写一段播客节目的开场白，主题是"AI时代的阅读"，要求温暖、有深度、引人入胜，大约200字。' },
        { name: '文章摘要', prompt: '请帮我把以下文章压缩成一个简洁的摘要，保留核心观点：\n\n[在此粘贴文章内容]' },
        { name: '写作润色', prompt: '请帮我润色以下文字，使其更加流畅、优美、有感染力：\n\n[在此粘贴需要润色的文字]' },
        { name: '标题生成', prompt: '请为以下文章生成5个吸引人的标题，每个标题不超过20字：\n\n[在此粘贴文章内容]' },
        { name: '问答助手', prompt: '解释一下什么是"涌现"能力（Emergent Ability），用通俗易懂的语言，最好有例子。' }
      ];
      
      const template = templates[Math.floor(Math.random() * templates.length)];
      document.getElementById('text-prompt').value = template.prompt;
    }
    
    // ===== 工具函数 =====
    function formatBytes(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
    }
    
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
