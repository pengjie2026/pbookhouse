<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 工具箱 — 蒲草书屋</title>
  <meta name="description" content="蒲草书屋 AI 工具箱，提供语音朗读、AI 配图生成、AI 写作优化功能。" />

  <!-- 样式 -->
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* AI 工具箱页面专属样式 */
    :root {
      --color-accent: #5b7e6e;
      --color-accent-light: #e8f0ec;
      --color-border: #e8e8e8;
      --color-gray: #666;
      --color-gray-medium: #888;
      --color-gray-dark: #333;
      --color-black: #000;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    body {
      font-family: var(--font-family);
      background: var(--color-gray-bg);
      min-height: 100vh;
    }

    /* 页面容器 */
    .ai-page {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    /* 页面标题 */
    .ai-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .ai-header h1 {
      font-size: 32px;
      color: var(--color-black);
      margin-bottom: 12px;
    }

    .ai-header p {
      color: var(--color-gray);
      font-size: 16px;
    }

    /* 功能卡片 */
    .ai-section {
      background: white;
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }

    .ai-section h2 {
      font-size: 20px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* 表单元素 */
    .ai-section label {
      display: block;
      font-size: 14px;
      color: var(--color-gray);
      margin-bottom: 8px;
    }

    .ai-section textarea,
    .ai-section input {
      width: 100%;
      padding: 14px;
      border: 1px solid var(--color-border);
      border-radius: 10px;
      font-family: var(--font-family);
      font-size: 15px;
      transition: border-color 0.2s;
      box-sizing: border-box;
    }

    .ai-section textarea:focus,
    .ai-section input:focus {
      outline: none;
      border-color: var(--color-accent);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
      margin-bottom: 12px;
    }

    textarea.mini {
      min-height: 60px;
    }

    select {
      padding: 10px 14px;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      font-size: 14px;
      margin-left: 8px;
    }

    /* 按钮 */
    .btn-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 16px;
    }

    .btn {
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      font-family: var(--font-family);
    }

    .btn-primary {
      background: var(--color-accent);
      color: white;
    }

    .btn-primary:hover {
      background: #4a6b5d;
    }

    .btn-secondary {
      background: var(--color-accent-light);
      color: var(--color-accent);
    }

    .btn-secondary:hover {
      background: #d8e6de;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* 结果展示 */
    .result {
      margin-top: 20px;
      padding: 20px;
      background: var(--color-gray-bg);
      border-radius: 10px;
      font-size: 15px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .result.success {
      background: var(--color-accent-light);
    }

    .result.error {
      background: #fff0f0;
      color: #c53030;
    }

    /* 音频播放器 */
    audio {
      width: 100%;
      margin-top: 12px;
      border-radius: 8px;
    }

    /* 图片预览 */
    .image-preview {
      margin-top: 20px;
      text-align: center;
    }

    .image-preview img {
      max-width: 100%;
      max-height: 400px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    /* 加载状态 */
    .loading {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid var(--color-border);
      border-top-color: var(--color-accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 提示文字 */
    .tips {
      font-size: 13px;
      color: var(--color-gray);
      margin-top: 8px;
    }

    /* 版本信息 */
    .version-info {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-top: 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .version-info .version-text {
      font-size: 14px;
      color: var(--color-gray);
    }

    .version-info .version-text strong {
      color: var(--color-accent);
    }

    /* API 状态 */
    .api-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      background: #fef3c7;
      color: #92400e;
    }

    .api-status.ok {
      background: #d1fae5;
      color: #065f46;
    }

    .api-status.error {
      background: #fee2e2;
      color: #991b1b;
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .ai-page {
        padding: 20px 16px;
      }

      .ai-header h1 {
        font-size: 26px;
      }

      .ai-section {
        padding: 20px;
      }
    }
  </style>
</head>
<body>

<!-- ====== 导航栏 ====== -->
<nav class="nav">
  <div class="nav-inner">
    <a class="nav-logo" href="index.html">
      <div class="logo-icon">蒲</div>
      蒲草书屋
    </a>

    <div class="nav-links">
      <a href="index.html" data-page="home">首页</a>
      <a href="index.html#tags" data-page="tags">分类</a>
      <a href="index.html#about" data-page="about">关于</a>
      <a href="ai.html" data-page="ai" class="active">AI 工具</a>
    </div>

    <button class="nav-menu-btn" onclick="toggleMobileMenu()" aria-label="菜单">
      ☰
    </button>
  </div>
</nav>

<!-- ====== AI 工具箱页面 ====== -->
<div class="ai-page">

  <div class="ai-header">
    <h1>🎨 AI 工具箱</h1>
    <p>语音朗读 · AI 配图生成 · AI 写作优化</p>
  </div>

  <!-- API 状态 -->
  <div class="version-info">
    <div>
      <span class="api-status" id="api-status">检查中...</span>
    </div>
    <div class="version-text">
      服务版本: <strong id="server-version">-</strong>
      · 前端版本: <strong>v1.0.3</strong>
    </div>
  </div>

  <!-- 语音朗读 -->
  <section class="ai-section">
    <h2>🔊 语音朗读</h2>
    <label>输入要朗读的文字</label>
    <textarea id="tts-text" placeholder="输入你想让 AI 朗读的文字内容...">欢迎来到蒲草书屋，这里收录了科技、建筑、文学、摄影、艺术等领域的深度文章。愿你在这里找到精神的栖息地。</textarea>

    <div class="btn-row">
      <label style="margin: 0;">音色:</label>
      <select id="voice-select">
        <option value="Chinese (Mandarin)_Lyrical_Voice">中文-抒情语音</option>
        <option value="Chinese (Mandarin)_HK_Flight_Attendant">中文-香港空乘</option>
        <option value="Cantonese_GentleLady">粤语-温柔女士</option>
        <option value="English_Graceful_Lady">英文-优雅女士</option>
        <option value="English_Insightful_Speaker">英文-睿智演讲者</option>
      </select>
    </div>

    <div class="btn-row">
      <button id="tts-btn" class="btn btn-primary" onclick="generateSpeech()">
        🔊 生成朗读
      </button>
      <button class="btn btn-secondary" onclick="playDemo()">▶️ 听示例</button>
    </div>

    <div id="tts-result"></div>
  </section>

  <!-- AI 配图 -->
  <section class="ai-section">
    <h2>🖼️ AI 配图生成</h2>
    <label>图片描述（英文效果更好）</label>
    <textarea id="img-prompt" placeholder="描述你想要的图片，如：A minimalist bookshop with warm lighting...">A serene Chinese traditional study with bamboo scrolls, ink stones, and soft natural light streaming through paper windows</textarea>

    <div class="btn-row">
      <label style="margin: 0;">风格:</label>
      <select id="style-select">
        <option value="natural">自然真实</option>
        <option value="anime">动漫风格</option>
        <option value="flat_illustration">扁平插画</option>
      </select>
    </div>

    <div class="btn-row">
      <button id="img-btn" class="btn btn-primary" onclick="generateImage()">
        🎨 生成图片
      </button>
      <button class="btn btn-secondary" onclick="showPromptIdeas()">💡 灵感提示</button>
    </div>

    <div id="img-result"></div>
  </section>

  <!-- AI 写作 -->
  <section class="ai-section">
    <h2>✍️ AI 写作优化</h2>
    <label>输入需要优化的文字或提问</label>
    <textarea id="text-prompt" class="mini" placeholder="输入你想要 AI 优化或回答的内容...">请介绍一下你自己，包括你的能力、特长和应用场景。</textarea>

    <div class="btn-row">
      <label style="margin: 0;">模型:</label>
      <select id="text-model-select">
        <option value="MiniMax-M2.7">MiniMax-M2.7 (推荐)</option>
        <option value="MiniMax-M2.5">MiniMax-M2.5</option>
      </select>
    </div>

    <div class="btn-row">
      <button id="text-btn" class="btn btn-primary" onclick="generateText()">
        ✍️ 生成优化
      </button>
      <button class="btn btn-secondary" onclick="useTextTemplate()">📝 使用模板</button>
    </div>

    <div id="text-result"></div>
  </section>

  <!-- 底部信息 -->
  <div style="text-align: center; margin-top: 40px; color: var(--color-gray); font-size: 13px;">
    <p>Powered by MiniMax API · 蒲草书屋</p>
    <p style="margin-top: 8px;">
      <a href="ai-features/" style="color: var(--color-accent);">高级功能 →</a>
    </p>
  </div>

</div>

<!-- ====== Footer ====== -->
<footer class="footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <div style="width:24px;height:24px;background:var(--color-accent);border-radius:4px;display:flex;align-items:center;justify-content:center;color:white;font-size:12px;font-weight:600">蒲</div>
      蒲草书屋
    </div>
    <p class="footer-copy">© 2026 蒲草书屋 · 文字与光的栖所</p>
    <div class="footer-links">
      <a href="index.html">首页</a>
      <a href="ai.html">AI 工具</a>
    </div>
  </div>
</footer>

<script>
  // ===== 配置 =====
  const API_BASE = 'https://pugrass-ai.laopeng.workers.dev';
  const FRONTEND_VERSION = '1.0.3';

  // ===== 工具函数 =====
  function formatBytes(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // ===== API 状态检查 =====
  async function checkApiStatus() {
    const statusEl = document.getElementById('api-status');
    const versionEl = document.getElementById('server-version');

    try {
      const res = await fetch(`${API_BASE}/health`);
      if (res.ok) {
        statusEl.className = 'api-status ok';
        statusEl.textContent = '✓ 服务正常';

        const versionRes = await fetch(`${API_BASE}/version`);
        if (versionRes.ok) {
          const data = await versionRes.json();
          versionEl.textContent = `v${data.version}`;
        }
      } else {
        statusEl.className = 'api-status error';
        statusEl.textContent = '✗ 连接失败';
      }
    } catch (e) {
      statusEl.className = 'api-status error';
      statusEl.textContent = '✗ 连接失败';
      versionEl.textContent = '无法获取';
    }
  }

  // 页面加载时检查
  checkApiStatus();

  // ===== 语音合成 =====
  async function generateSpeech() {
    const btn = document.getElementById('tts-btn');
    const resultEl = document.getElementById('tts-result');
    const text = document.getElementById('tts-text').value.trim();
    const voice = document.getElementById('voice-select').value;

    if (!text) {
      alert('请输入要朗读的文字');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="loading"><span class="spinner"></span>生成中...</span>';
    resultEl.innerHTML = '';

    try {
      const res = await fetch(`${API_BASE}/tts`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, voice_id: voice, speed: 1.0 })
      });

      if (!res.ok) {
        const errText = await res.text();
        throw new Error('生成失败: ' + errText);
      }

      const contentType = res.headers.get('content-type') || '';

      if (contentType.includes('application/json')) {
        const data = await res.json();
        throw new Error(JSON.stringify(data, null, 2));
      }

      const blob = await res.blob();

      if (blob.size < 100) {
        throw new Error('音频文件太小，可能是生成失败');
      }

      const url = URL.createObjectURL(blob);

      resultEl.innerHTML = `
        <div class="result success">✅ 朗读已生成！文件大小: ${formatBytes(blob.size)}</div>
        <audio controls src="${url}"></audio>
        <div class="btn-row">
          <button class="btn btn-secondary" onclick="downloadAudio('${url}')" style="margin-top:12px">💾 下载音频</button>
        </div>
      `;
    } catch (error) {
      resultEl.innerHTML = `<div class="result error">❌ ${error.message}</div>`;
    } finally {
      btn.disabled = false;
      btn.innerHTML = '🔊 生成朗读';
    }
  }

  async function playDemo() {
    const demoText = '欢迎来到蒲草书屋，这里收录了科技、建筑、文学、摄影、艺术等领域的深度文章。愿你在这里找到精神的栖息地。';
    const btn = document.getElementById('tts-btn');
    const resultEl = document.getElementById('tts-result');

    btn.disabled = true;
    btn.innerHTML = '<span class="loading"><span class="spinner"></span>生成中...</span>';

    try {
      const res = await fetch(`${API_BASE}/tts`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: demoText, voice_id: 'Chinese (Mandarin)_Lyrical_Voice', speed: 1.0 })
      });

      if (!res.ok) throw new Error('生成失败');

      const blob = await res.blob();
      const url = URL.createObjectURL(blob);

      resultEl.innerHTML = `
        <div class="result success">✅ 示例朗读已生成！</div>
        <audio controls src="${url}"></audio>
      `;

      const audio = resultEl.querySelector('audio');
      audio.play().catch(() => {});
    } catch (error) {
      resultEl.innerHTML = `<div class="result error">❌ ${error.message}</div>`;
    } finally {
      btn.disabled = false;
      btn.innerHTML = '🔊 生成朗读';
    }
  }

  function downloadAudio(url) {
    const a = document.createElement('a');
    a.href = url;
    a.download = `蒲草书屋朗读_${Date.now()}.mp3`;
    a.click();
  }

  // ===== 图片生成 =====
  async function generateImage() {
    const btn = document.getElementById('img-btn');
    const resultEl = document.getElementById('img-result');
    const prompt = document.getElementById('img-prompt').value.trim();
    const style = document.getElementById('style-select').value;

    if (!prompt) {
      alert('请输入图片描述');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="loading"><span class="spinner"></span>生成中...</span>';
    resultEl.innerHTML = '';

    try {
      const res = await fetch(`${API_BASE}/image`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt, style })
      });

      if (!res.ok) {
        const errText = await res.text();
        throw new Error('生成失败: ' + errText);
      }

      const data = await res.json();

      let imageData = data.data?.[0] || data[0];
      if (typeof imageData === 'string') {
        imageData = imageData;
      } else {
        imageData = imageData?.b64_json || imageData?.url;
      }

      if (imageData) {
        const isBase64 = imageData.length > 100 && !imageData.startsWith('http');
        const imgSrc = isBase64 ? `data:image/png;base64,${imageData}` : imageData;

        resultEl.innerHTML = `
          <div class="result success">✅ 图片已生成！</div>
          <div class="image-preview">
            <img src="${imgSrc}" alt="AI 生成的图片" />
          </div>
          ${isBase64 ? `<button class="btn btn-secondary" onclick="downloadImage('${imageData}')" style="margin-top:12px">💾 下载图片</button>` : ''}
        `;
      } else {
        resultEl.innerHTML = `<div class="result error">❌ 未获取到图片数据</div>`;
      }
    } catch (error) {
      resultEl.innerHTML = `<div class="result error">❌ ${error.message}</div>`;
    } finally {
      btn.disabled = false;
      btn.innerHTML = '🎨 生成图片';
    }
  }

  function downloadImage(b64) {
    const link = document.createElement('a');
    link.href = `data:image/png;base64,${b64}`;
    link.download = `蒲草书屋配图_${Date.now()}.png`;
    link.click();
  }

  function showPromptIdeas() {
    const ideas = [
      'A cozy minimalist library with floor-to-ceiling bookshelves, warm wood tones, natural light',
      'Traditional Chinese ink painting style, a scholar\'s desk with bamboo brushes, ink stone',
      'Modern architecture meets nature, a glass-walled study overlooking a serene garden',
      'Abstract digital art, the concept of reading and imagination, floating books transforming into stars',
      'Cozy autumn reading corner, warm golden light, knitted blankets, a cup of tea'
    ];

    const randomIdea = ideas[Math.floor(Math.random() * ideas.length)];
    document.getElementById('img-prompt').value = randomIdea;
  }

  // ===== 文本生成 =====
  async function generateText() {
    const btn = document.getElementById('text-btn');
    const resultEl = document.getElementById('text-result');
    const prompt = document.getElementById('text-prompt').value.trim();
    const model = document.getElementById('text-model-select').value;

    if (!prompt) {
      alert('请输入需要优化的文字或提问');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="loading"><span class="spinner"></span>生成中...</span>';
    resultEl.innerHTML = '';

    try {
      const res = await fetch(`${API_BASE}/text`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt, model })
      });

      if (!res.ok) {
        const errText = await res.text();
        throw new Error('生成失败: ' + errText);
      }

      const data = await res.json();

      if (data.text) {
        resultEl.innerHTML = `
          <div class="result success">✅ 文本已生成！</div>
          <div class="result" style="background:white">${escapeHtml(data.text)}</div>
        `;
      } else {
        resultEl.innerHTML = `<div class="result error">❌ 未获取到文本数据</div>`;
      }
    } catch (error) {
      resultEl.innerHTML = `<div class="result error">❌ ${error.message}</div>`;
    } finally {
      btn.disabled = false;
      btn.innerHTML = '✍️ 生成优化';
    }
  }

  function useTextTemplate() {
    const templates = [
      { name: '开场白', prompt: '请帮我写一段播客节目的开场白，主题是"AI时代的阅读"，要求温暖、有深度、引人入胜，大约200字。' },
      { name: '文章摘要', prompt: '请帮我把以下文章压缩成一个简洁的摘要，保留核心观点：\n\n[在此粘贴文章内容]' },
      { name: '写作润色', prompt: '请帮我润色以下文字，使其更加流畅、优美、有感染力：\n\n[在此粘贴需要润色的文字]' },
      { name: '标题生成', prompt: '请为以下文章生成5个吸引人的标题，每个标题不超过20字：\n\n[在此粘贴文章内容]' },
      { name: '问答助手', prompt: '解释一下什么是"涌现"能力（Emergent Ability），用通俗易懂的语言，最好有例子。' }
    ];

    const template = templates[Math.floor(Math.random() * templates.length)];
    document.getElementById('text-prompt').value = template.prompt;
  }
</script>

</body>
</html>
